<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Weld line reference diagram</title>
  <desc id="description">Two opposing plastic flow fronts meet at a visible weld line in the center of a molded part.</desc>
  <defs>
    <linearGradient id="leftFlow" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="rightFlow" x1="1" x2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="640" height="400" rx="24" fill="#0f172a"/>
  <text x="320" y="54" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Weld Line Reference Diagram</text>
  <g filter="url(#shadow)">
    <path d="M91 125h194c25 0 46 15 55 38l14 36-14 36c-9 23-30 38-55 38H91c-25 0-45-20-45-45v-58c0-25 20-45 45-45Z" fill="url(#leftFlow)"/>
    <path d="M549 125H355c-25 0-46 15-55 38l-14 36 14 36c9 23 30 38 55 38h194c25 0 45-20 45-45v-58c0-25-20-45-45-45Z" fill="url(#rightFlow)"/>
  </g>
  <path d="M320 133c-16 20 15 33 0 52s16 32 0 50 16 32 0 51" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
  <path d="M320 133c-16 20 15 33 0 52s16 32 0 50 16 32 0 51" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <path d="M196 91 282 151" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <path d="M444 91 358 151" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  <text x="162" y="84" fill="#bae6fd" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Flow front</text>
  <text x="478" y="84" fill="#fef3c7" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Flow front</text>
  <path d="M320 283v43" fill="none" stroke="#f8fafc" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="320" y="355" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Visible weld line where flow fronts meet</text>
</svg>
