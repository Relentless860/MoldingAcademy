<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mold Setup & Changeover</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Mold Setup & Changeover</h1>

        <p>
            Learn how to prepare, hang, connect, protect, and safely start
            an injection mold for production.
        </p>

    </header>

    <!-- BACK BUTTON -->

    <div class="back-button">

        <button class="home-btn"
                onclick="location.href='../index.html'">

            ← Back to Home

        </button>

    </div>

    <!-- MAIN CONTENT -->

    <main class="lesson-layout">

        <!-- MOLD SETUP TOPICS -->

        <section class="card">

            <h2>Mold Setup Topics</h2>

            <p>
                Select a mold setup topic below to begin training.
            </p>

            <div class="button-group">

                <button onclick="showMoldSetup('preparation')">
                    Mold Preparation
                </button>

                <button onclick="showMoldSetup('machine-match')">
                    Machine / Mold Match
                </button>

                <button onclick="showMoldSetup('hanging')">
                    Mold Hanging
                </button>

                <button onclick="showMoldSetup('clamping')">
                    Clamp Setup
                </button>

                <button onclick="showMoldSetup('nozzle')">
                    Nozzle Alignment
                </button>

                <button onclick="showMoldSetup('waterlines')">
                    Waterlines
                </button>

                <button onclick="showMoldSetup('ejectors')">
                    Ejector Setup
                </button>

                <button onclick="showMoldSetup('cores')">
                    Core Pulls & Slides
                </button>

                <button onclick="showMoldSetup('protection')">
                    Mold Protection
                </button>

                <button onclick="showMoldSetup('drycycle')">
                    Dry Cycling
                </button>

                <button onclick="showMoldSetup('firstshots')">
                    First Shots
                </button>

                <button onclick="showMoldSetup('changeover')">
                    Changeover Checklist
                </button>

            </div>

        </section>

        <!-- MOLD SETUP INFORMATION -->

        <section class="card">

            <h2>Mold Setup Information</h2>

            <div id="moldSetupBox">

                <p>
                    Select a mold setup topic to begin training.
                </p>

            </div>

        </section>

        <!-- COMPLETE LESSON -->

        <section class="card">

            <button onclick="markLessonComplete('mold-setup')">

                Mark Mold Setup Complete

            </button>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script src="mold-setup.js"></script>

    <script src="../progress.js"></script>

    <script src="../feedback.js"></script>

</body>

</html>
