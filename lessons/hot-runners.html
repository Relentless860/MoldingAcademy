<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hot Runner Systems</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Hot Runner Systems</h1>

        <p>
            Learn how hot runner systems work, how to identify common issues,
            and how hot runner performance affects part quality.
        </p>

    </header>

    <!-- BACK BUTTON -->

    <div class="back-button">

        <button class="home-btn"
                onclick="location.href='../index.html'">

            ← Back to Home

        </button>

    </div>

    <!-- MAIN CONTENT -->

    <main class="lesson-layout">

        <!-- HOT RUNNER TOPICS -->

        <section class="card">

            <h2>Hot Runner Topics</h2>

            <p>
                Select a hot runner topic below to begin training.
            </p>

            <div class="button-group">

                <button onclick="showHotRunner('overview')">
                    Hot Runner Overview
                </button>

                <button onclick="showHotRunner('manifold')">
                    Manifold
                </button>

                <button onclick="showHotRunner('drops')">
                    Drops / Nozzles
                </button>

                <button onclick="showHotRunner('heaters')">
                    Heaters
                </button>

                <button onclick="showHotRunner('thermocouples')">
                    Thermocouples
                </button>

                <button onclick="showHotRunner('controller')">
                    Controller
                </button>

                <button onclick="showHotRunner('valvegates')">
                    Valve Gates
                </button>

                <button onclick="showHotRunner('coldslug')">
                    Cold Drops
                </button>

                <button onclick="showHotRunner('balance')">
                    Hot Runner Balance
                </button>

                <button onclick="showHotRunner('colorchange')">
                    Color Change / Purging
                </button>

                <button onclick="showHotRunner('defects')">
                    Hot Runner Defects
                </button>

                <button onclick="showHotRunner('safety')">
                    Safety
                </button>

            </div>

        </section>

        <!-- HOT RUNNER INFORMATION -->

        <section class="card">

            <h2>Hot Runner Information</h2>

            <div id="hotRunnerBox">

                <p>
                    Select a hot runner topic to begin training.
                </p>

            </div>

        </section>

        <!-- COMPLETE LESSON -->

        <section class="card">

            <button onclick="markLessonComplete('hot-runners')">

                Mark Hot Runner Systems Complete

            </button>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script src="hot-runners.js"></script>

    <script src="../progress.js"></script>

    <script src="../feedback.js"></script>

</body>

</html>
