<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Training Quiz</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Training Quiz</h1>

        <p>
            Test your knowledge by category or take a full mixed final exam.
        </p>

    </header>

    <!-- BACK BUTTON -->

    <div class="back-button">

        <button class="home-btn"
                onclick="location.href='../index.html'">

            ← Back to Home

        </button>

    </div>

    <!-- MAIN CONTENT -->

    <main class="lesson-layout">

        <!-- CATEGORY SELECTION -->

        <section class="card" id="categoryCard">

            <h2>Select Test Category</h2>

            <p>
                Choose a category below to begin your test.
            </p>

            <div class="button-group">

                <button onclick="startQuiz('machine')">
                    Machine Basics Test
                </button>

                <button onclick="startQuiz('processing')">
                    Processing Parameters Test
                </button>

                <button onclick="startQuiz('troubleshooting')">
                    Troubleshooting Test
                </button>

                <button onclick="startQuiz('materials')">
                    Materials & Resin Science Test
                </button>

                <button onclick="startQuiz('moldsetup')">
                    Mold Setup & Changeover Test
                </button>

                <button onclick="startQuiz('scientific')">
                    Scientific Molding Test
                </button>

                <button onclick="startQuiz('quality')">
                    Quality & Inspection Test
                </button>

                <button onclick="startQuiz('hotrunner')">
                    Hot Runner Systems Test
                </button>

                <button onclick="startQuiz('cooling')">
                    Water & Cooling Systems Test
                </button>

                <button onclick="startQuiz('robotics')">
                    Robotics & Automation Test
                </button>

                <button onclick="startQuiz('mixed')">
                    Full Mixed Final Exam
                </button>

            </div>

        </section>

        <!-- QUIZ AREA -->

        <section class="card">

            <h2 id="quizTitle">Quiz</h2>

            <div id="quizBox">

                <p>
                    Select a test category to begin.
                </p>

            </div>

            <div id="resultBox">

                <p>
                    Your score and feedback will appear here.
                </p>

            </div>

        </section>

        <!-- COMPLETE QUIZ -->

        <section class="card">

            <button onclick="markLessonComplete('troubleshooting-quiz')">

                Mark Quiz Complete

            </button>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script src="troubleshooting-quiz.js"></script>

    <script src="../progress.js"></script>

    <script src="../feedback.js"></script>

</body>

</html>
